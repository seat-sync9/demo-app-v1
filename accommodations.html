<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accommodations - Seat-Sync demo</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main id="main">
  <h1>Accommodations</h1>
  <p class="muted">The catalog of all generally available accommodations. Add the ones your center supports; they then appear under <a href="center-accommodations.html">Center Accommodations</a>, where you set quantities and notes.</p>
  <div id="msg" role="alert" hidden></div>
  <div class="row">
    <div><label for="filter">Search</label><input id="filter" type="search" placeholder="e.g. room"></div>
    <div><label for="cat">Category</label><select id="cat"><option value="">All</option></select></div>
    <div><label for="show">Show</label>
      <select id="show"><option value="">All</option><option value="added">In my center</option><option value="not">Not in my center</option></select></div>
  </div>
  <div class="table-wrap" style="margin-top:1rem">
    <table>
      <thead><tr><th>Name</th><th>Category</th><th>Kind</th><th>My center</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="muted" id="count" aria-live="polite"></p>
</main>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
SS.shell({ page: 'accommodations.html', owner: true });
var center = SS.currentCenter();
var msg = document.getElementById('msg');
var $ = function (id) { return document.getElementById(id); };
var catalog = window.SeatSyncSeed.CATALOG;

var cats = [];
catalog.forEach(function (c) { if (cats.indexOf(c.category) < 0) { cats.push(c.category); } });
$('cat').insertAdjacentHTML('beforeend', cats.map(function (c) {
  return '<option>' + SS.esc(c) + '</option>';
}).join(''));

function render() {
  var s = SS.load(), have = {}, q = $('filter').value.toLowerCase();
  SS.centerAccsFor(s, center.id).forEach(function (c) { have[c.code] = c; });
  var list = catalog.filter(function (it) {
    if (q && (it.name + ' ' + it.category).toLowerCase().indexOf(q) < 0) { return false; }
    if ($('cat').value && it.category !== $('cat').value) { return false; }
    if ($('show').value === 'added' && !have[it.code]) { return false; }
    if ($('show').value === 'not' && have[it.code]) { return false; }
    return true;
  });
  $('rows').innerHTML = list.map(function (it) {
    var h = have[it.code];
    return '<tr><td>' + SS.esc(it.name) + '</td><td>' + SS.esc(it.category) + '</td><td>' + it.kind + '</td>' +
      '<td>' + (h ? '<span class="pill ' + (h.active ? 'active' : 'inactive') + '">' + (h.active ? 'In my center' : 'In my center (inactive)') + '</span>' : '<span class="muted">Not added</span>') + '</td>' +
      '<td>' + (h ? '' : '<button class="btn small" data-code="' + it.code + '">Add to my center</button>') + '</td></tr>';
  }).join('') || '<tr><td colspan="5" class="muted">No accommodations match.</td></tr>';
  $('count').textContent = list.length + ' of ' + catalog.length + ' catalog items shown. ' +
    Object.keys(have).length + ' supported by this center.';
}

['filter', 'cat', 'show'].forEach(function (id) { $(id).addEventListener('input', render); });

$('rows').addEventListener('click', function (e) {
  var code = e.target.getAttribute('data-code');
  if (!code) { return; }
  var s = SS.load();
  s.nextId += 1;
  s.centerAccs.push({ id: 'ca_' + s.nextId, centerId: center.id, code: code, qty: 1, notes: '', fav: false, active: true });
  SS.save();
  msg.className = 'msg ok'; msg.hidden = false;
  msg.innerHTML = SS.esc(SS.catalogItem(code).name) + ' added with quantity 1. Set the quantity in <a href="center-accommodations.html">Center Accommodations</a>.';
  render();
});

render();
</script>
</body>
</html>
